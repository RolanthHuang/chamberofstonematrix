<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style>
</head><body>
<title>Chamber of Stone Matrix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: a carved stage. The 3D chamber runs full-bleed between a thin inscription band (top) and a stone altar dock (bottom); the math ledger slides in from the right. One dark world by design. */
:root{
  color-scheme: dark;
  --ink:#0d0a07;
  --stone:#18120d;
  --stone-2:#231a13;
  --stone-3:#30251b;
  --sink:rgba(0,0,0,.30);
  --glass:rgba(21,15,10,.80);
  --edge:rgba(242,176,79,.18);
  --edge-strong:rgba(242,176,79,.46);
  --sand:#ecdfc6;
  --dust:#ad9a7b;
  --ash:#7a6b56;
  --torch:#f2b04f;
  --torch-hi:#ffd894;
  --torch-ink:#2b1806;
  --ember:#d8772f;
  --spirit:#8be4f2;
  --win:#a9de8c;
  --loss:#e98a70;
  --shade:rgba(0,0,0,.5);
  --font-display:"Cinzel","Noto Serif TC","Songti TC",Georgia,serif;
  --font-cjk:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --step--1:12px; --step-0:14px; --step-1:16px; --step-2:20px; --step-3:28px; --step-4:40px;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--ink);color:var(--sand);font:var(--step-0)/1.45 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--torch-hi);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.band-inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top band */
.top{position:relative;z-index:6;background:linear-gradient(180deg,var(--stone-2),var(--stone));border-bottom:1px solid var(--edge)}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:9px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.sigil{width:30px;height:30px;color:var(--torch);flex:none}
.brand h1{margin:0;font:700 17px/1.1 var(--font-display);letter-spacing:.08em;color:var(--torch-hi);text-wrap:balance}
.brand p{margin:2px 0 0;font-size:var(--step--1);color:var(--dust);letter-spacing:.06em}
.top-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--edge-strong);border-radius:9px;overflow:hidden;background:var(--sink)}
.seg button{appearance:none;border:0;background:transparent;color:var(--dust);font-weight:700;font-size:13px;line-height:1;padding:9px 11px;min-width:40px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--torch-hi),var(--torch));color:var(--torch-ink)}
.seg button:disabled{cursor:not-allowed;opacity:.5}
.icon-btn{appearance:none;width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--edge-strong);border-radius:9px;background:var(--sink);color:var(--sand);cursor:pointer;padding:0}
.icon-btn svg{width:18px;height:18px}
#soundBtn[aria-pressed="false"] .wave{display:none}
#soundBtn[aria-pressed="true"] .mute{display:none}
.ledger-btn{appearance:none;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--edge-strong);background:var(--sink);color:var(--torch-hi);font:700 14px/1 var(--font-cjk);letter-spacing:.14em;cursor:pointer}
.ledger-btn[aria-expanded="true"]{background:linear-gradient(180deg,var(--torch-hi),var(--torch));color:var(--torch-ink)}

/* stage */
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--stone-2) 0%,var(--ink) 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl.dragging{cursor:grabbing}
#gl.pointing{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.hud{position:absolute;z-index:3;top:12px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100% - 210px)}
.hud-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;line-height:1;padding:6px 9px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);color:var(--dust);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--sand);font-weight:700}
.pill.bonus{border-color:var(--spirit);color:var(--spirit)}
.history{display:flex;flex-wrap:wrap;gap:4px}
.history span{font-size:11px;line-height:1;padding:4px 6px;border-radius:6px;background:var(--glass);border:1px solid var(--edge);color:var(--ash);font-variant-numeric:tabular-nums}
.history span.up{color:var(--win)}
.history span.down{color:var(--loss)}
.paytable{position:absolute;z-index:3;top:12px;right:max(16px,env(safe-area-inset-right,0px));min-width:156px;padding:10px 12px;border:1px solid var(--edge);border-radius:12px;background:var(--glass)}
.pt-title{font:700 12px/1 var(--font-cjk);letter-spacing:.18em;color:var(--dust);margin-bottom:8px}
.pt-list{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.pt-list li{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--dust);padding:3px 6px;border-radius:6px;font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
.pt-list li b{color:var(--sand);font-weight:700}
.pt-list li.jack b{color:var(--torch-hi)}
.pt-list li.hl{background:rgba(242,176,79,.24);color:var(--sand)}
.toast{position:absolute;z-index:4;left:50%;top:15%;transform:translate(-50%,10px);opacity:0;pointer-events:none;text-align:center;transition:opacity .25s,transform .25s;padding:12px 22px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--edge-strong);width:max-content;min-width:190px;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .t-tag{font:700 13px/1 var(--font-display);letter-spacing:.32em;color:var(--torch);margin-bottom:8px}
.toast .t-big{font:700 var(--step-4)/1 var(--font-display);color:var(--torch-hi);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.toast .t-mid{font:700 var(--step-2)/1.25 var(--font-cjk);letter-spacing:.12em;color:var(--sand)}
.toast .t-sub{margin-top:6px;font-size:13px;color:var(--dust)}
.toast.lose .t-mid{color:var(--dust)}
.toast.big{border-color:var(--torch);box-shadow:0 0 70px rgba(242,176,79,.35)}
.hint{position:absolute;z-index:3;left:50%;bottom:12px;transform:translateX(-50%);margin:0;padding:7px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--dust);font-size:12px;line-height:1.35;text-align:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .3s}
.hint.off{opacity:0}
.veil{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:var(--ink);transition:opacity .6s}
.veil.gone{opacity:0;pointer-events:none}
.veil-inner{display:grid;justify-items:center;gap:14px;padding:0 24px}
.veil-ring{width:46px;height:46px;border-radius:50%;border:2px solid var(--edge-strong);border-top-color:var(--torch-hi);animation:spin 1.1s linear infinite}
.veil.err .veil-ring{animation:none;border-color:var(--loss)}
.veil p{margin:0;color:var(--dust);font-size:13px;letter-spacing:.06em;text-align:center;max-width:34ch}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(60% 60% at 50% 45%,rgba(255,216,148,.5),rgba(255,216,148,0) 70%);opacity:0}
.flash.on{animation:flash 1.2s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

/* tile labels */
.tl{position:absolute;left:0;top:0;transform:translate(-999px,-999px);will-change:transform;font-size:11px;line-height:1;white-space:nowrap;border-radius:999px;padding:3px 6px;font-weight:700;font-variant-numeric:tabular-nums;transition:opacity .15s}
.tl.bet{background:linear-gradient(180deg,var(--torch-hi),var(--torch));color:var(--torch-ink);box-shadow:0 2px 8px var(--shade)}
.tl.res{background:var(--glass);border:1px solid var(--edge-strong);color:var(--sand);display:flex;align-items:baseline;gap:4px;padding:4px 7px}
.tl.res b{font:700 13px/1 var(--font-display);color:var(--torch-hi)}
.tl.res em{font-style:normal;color:var(--dust);font-size:10px}
.tl.res i{font-style:normal;color:var(--win)}
.tl.res.k0{opacity:.72;padding:3px 6px}
.tl.res.k0 b{color:var(--ash);font-size:11px}
.tl.res.jack{background:linear-gradient(180deg,var(--torch-hi),var(--torch));border-color:var(--torch-hi)}
.tl.res.jack b,.tl.res.jack i,.tl.res.jack em{color:var(--torch-ink)}

/* dock */
.dock{position:relative;z-index:6;background:linear-gradient(0deg,var(--stone),var(--stone-2));border-top:1px solid var(--edge)}
.dock-inner{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto;grid-template-areas:"bal chips bet act start win";align-items:center;gap:10px 18px;padding-block:10px 12px}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.k{font:700 11px/1 var(--font-cjk);letter-spacing:.2em;color:var(--ash)}
.stat .v{font:700 var(--step-2)/1 var(--font-display);color:var(--sand);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat-bal{grid-area:bal}
.stat-bet{grid-area:bet}
.stat-win{grid-area:win;align-items:flex-end;text-align:right}
.stat-win .v.up{color:var(--win)}
.chips-wrap{grid-area:chips;display:flex;flex-direction:column;gap:6px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;min-width:44px;height:34px;padding:0 10px;border-radius:999px;border:1px dashed var(--edge-strong);background:var(--sink);color:var(--dust);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--torch);color:var(--torch-ink);background:radial-gradient(circle at 50% 35%,var(--torch-hi),var(--torch))}
.actions{grid-area:act;display:flex;gap:6px}
.btn{appearance:none;height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--edge-strong);background:var(--sink);color:var(--sand);font:700 14px/1 var(--font-cjk);letter-spacing:.12em;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--spirit);color:var(--spirit);background:rgba(139,228,242,.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.start{grid-area:start;appearance:none;min-width:132px;height:52px;padding:0 22px;border-radius:14px;border:1px solid var(--torch-hi);background:linear-gradient(180deg,var(--torch-hi),var(--torch) 55%,var(--ember));color:var(--torch-ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 0 0 3px rgba(242,176,79,.12),0 6px 22px rgba(242,176,79,.25);transition:transform .12s,box-shadow .2s,filter .2s}
.start-cn{font:700 20px/1 var(--font-cjk);letter-spacing:.4em;padding-left:.4em}
.start-sub{font:700 9px/1 var(--font-ui);letter-spacing:.3em;opacity:.6}
.start:hover:not(:disabled){filter:brightness(1.07)}
.start:active:not(:disabled){transform:translateY(1px)}
.start:disabled{filter:grayscale(.75) brightness(.55);cursor:not-allowed;box-shadow:none}

/* ledger drawer */
.drawer{position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(440px,100%);display:flex;flex-direction:column;background:var(--stone);border-left:1px solid var(--edge-strong);box-shadow:-20px 0 60px var(--shade);transform:translateX(102%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--edge)}
.drawer-head h2{margin:0;font:700 18px/1 var(--font-cjk);letter-spacing:.2em;color:var(--torch-hi)}
.drawer-body{flex:1;overflow-y:auto;padding:0 16px 28px;overscroll-behavior:contain}
.scrim{position:fixed;inset:0;z-index:19;background:var(--shade)}
.sec{padding:16px 0;border-bottom:1px solid var(--edge)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font:700 15px/1.3 var(--font-cjk);letter-spacing:.1em;color:var(--sand);display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.sec p{margin:0 0 10px;color:var(--dust);font-size:13px;line-height:1.65;max-width:60ch}
.tag{font:700 11px/1 var(--font-ui);letter-spacing:.04em;padding:4px 7px;border-radius:999px;border:1px solid var(--edge-strong);color:var(--dust)}
.tag.ok{border-color:var(--win);color:var(--win)}
.tag.spirit{border-color:var(--spirit);color:var(--spirit)}
.tag.warn{border-color:var(--loss);color:var(--loss)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.kpi{padding:10px 12px;border-radius:10px;background:var(--stone-2);border:1px solid var(--edge)}
.kpi span{display:block;font-size:11px;color:var(--ash);letter-spacing:.08em}
.kpi b{display:block;margin-top:5px;font:700 20px/1 var(--font-display);color:var(--sand);font-variant-numeric:tabular-nums}
.kpi.main b{color:var(--torch-hi)}
.param{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 12px;font-size:13px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--edge-strong);border-radius:9px;overflow:hidden}
.stepper button{appearance:none;width:34px;height:32px;border:0;background:var(--sink);color:var(--sand);cursor:pointer;font-size:16px}
.stepper input{width:58px;height:32px;border:0;border-inline:1px solid var(--edge);background:var(--stone-2);color:var(--sand);text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table.mt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.mt th{font-weight:700;color:var(--ash);text-align:right;padding:6px;border-bottom:1px solid var(--edge);white-space:nowrap}
.mt th:first-child,.mt td:first-child{text-align:left}
.mt td{padding:5px 6px;text-align:right;color:var(--sand);border-bottom:1px solid rgba(242,176,79,.07);white-space:nowrap}
.mt td.dim,.mt .dim{color:var(--dust)}
.mt input{width:64px;height:28px;border:1px solid var(--edge-strong);border-radius:7px;background:var(--stone-2);color:var(--torch-hi);text-align:right;padding:0 6px;font-weight:700;font-variant-numeric:tabular-nums}
.mt tfoot td{font-weight:700;border-bottom:0;color:var(--torch-hi)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-sm{appearance:none;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--edge-strong);background:var(--sink);color:var(--sand);font-size:13px;cursor:pointer}
.btn-sm.primary{background:linear-gradient(180deg,var(--torch-hi),var(--torch));color:var(--torch-ink);border-color:var(--torch-hi);font-weight:700}
.btn-sm:disabled{opacity:.5;cursor:not-allowed}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--sand);cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--torch);flex:none}
.switch b{color:var(--spirit)}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;align-items:center;gap:8px;font-size:12px;color:var(--dust);font-variant-numeric:tabular-nums}
.bar i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ember),var(--torch-hi))}
.bar span:last-child{text-align:right}
.progress{height:4px;border-radius:2px;background:var(--stone-3);overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;width:0;background:var(--spirit);transition:width .1s}
.mc-out{font-size:13px;color:var(--dust)}
.mc-out .big{font:700 24px/1.1 var(--font-display);color:var(--spirit);font-variant-numeric:tabular-nums}
.mc-out .big small{font-size:14px;color:var(--dust);margin-left:6px}
.mc-out p{margin:6px 0 10px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:13px}
.statgrid div{display:flex;justify-content:space-between;gap:8px;color:var(--dust)}
.statgrid b{color:var(--sand);font-variant-numeric:tabular-nums}

@media (max-width: 1000px){
  .dock-inner{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"bal bet win" "chips chips chips" "act act start";gap:8px 12px}
  .start{min-width:0;width:100%;height:46px}
  .actions .btn{flex:1;padding:0 6px}
}
@media (max-width: 600px){
  .brand p{display:none}
  .brand h1{font-size:15px}
  .top-inner{padding-block:8px;gap:8px}
  .top-controls{gap:6px}
  .seg button{padding:8px 7px;min-width:30px;font-size:12px}
  .icon-btn{width:32px;height:32px}
  .ledger-btn{height:32px;padding:0 10px;font-size:13px;letter-spacing:.08em}
  .toast{top:auto;bottom:52px}
  .hud{max-width:calc(100% - 128px)}
  .paytable{padding:7px 9px;min-width:0}
  .pt-title{display:none}
  .pt-list li{font-size:11px;padding:2px 4px;gap:8px}
  .stat .v{font-size:17px}
  .hint{font-size:11px;bottom:8px}
  .toast .t-big{font-size:var(--step-3)}
}
@media (prefers-reduced-motion: reduce){
  .toast,.drawer,.hint{transition:none}
  .flash.on{animation:none}
  .veil-ring{animation:none}
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="band-inner top-inner">
      <div class="brand">
        <svg class="sigil" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/><rect x="6.5" y="18.5" width="6" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="19.5" y="7.5" width="6" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="13" y="12" width="6" height="6" rx="1" fill="currentColor"/><path d="M16 28.5V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="brand-text">
          <h1>Chamber of Stone Matrix</h1>
          <p>石陣密室 · 可玩原型 v0.1</p>
        </div>
      </div>
      <nav class="top-controls" aria-label="密室設定">
        <div class="seg" id="modeSeg" role="group" aria-label="維度">
          <button type="button" id="mode25" data-mode="2.5D" aria-pressed="false">2.5D</button>
          <button type="button" id="mode3" data-mode="3D" aria-pressed="true">3D</button>
        </div>
        <div class="seg" id="sizeSeg" role="group" aria-label="密室邊長">
          <button type="button" id="size3" data-n="3" aria-pressed="false" aria-label="邊長 3">3</button>
          <button type="button" id="size4" data-n="4" aria-pressed="true" aria-label="邊長 4">4</button>
          <button type="button" id="size5" data-n="5" aria-pressed="false" aria-label="邊長 5">5</button>
          <button type="button" id="size6" data-n="6" aria-pressed="false" aria-label="邊長 6">6</button>

    const lo = Math.max(0, model.M - 6), ps = model.mDist.slice(lo), mx = Math.max.apply(null, ps.concat([1e-12]));
    let rest = 0; for (let m = 0; m < lo; m++) rest += model.mDist[m];
    $('#mBars').innerHTML = ps.map(function (p, i) { return '<div class="bar"><span>m=' + (lo + i) + '</span><i style="width:' + ((p / mx) * 100).toFixed(1) + '%"></i><span>' + fmtPct(p, 2) + '</span></div>'; }).reverse().join('') +
      (lo > 0 ? '<div class="bar"><span>更少</span><i style="width:' + ((rest / mx) * 100).toFixed(1) + '%"></i><span>' + fmtPct(rest, 3) + '</span></div>' : '');
  }
  function bindMath() {
    const setM = function (v) { v = clamp(Math.round(v), 1, maxM()); $('#mInput').value = v; applyParams({ M: v }); };
    $('#mDec').onclick = function () { setM(params().M - 1); };
    $('#mInc').onclick = function () { setM(params().M + 1); };
    $('#mInput').onchange = function (e) { const v = +e.target.value; if (!Number.isFinite(v)) { e.target.value = params().M; return; } setM(v); };
    model.rows.forEach(function (r) {
      const inp = $('#odds-' + r.k);
      inp.onchange = function () {
        let v = +inp.value; if (!Number.isFinite(v) || v < 0) v = 0; v = Math.round(v * 100) / 100; inp.value = v;
        const o = params().odds.slice(); o[r.k] = v; applyParams({ odds: o });
      };
    });
    $('#bonusToggle').onchange = function (e) {
      if (isBusy()) { e.target.checked = state.bonus; return; }
      state.bonus = e.target.checked; buildStones(); renderHud(); renderPaytable();
    };
    const bt = $('#backToggle');
    if (bt) bt.onchange = function (e) { if (isBusy()) { e.target.checked = state.backWall; return; } state.backWall = e.target.checked; rebuildKeepingBets(); writeStore(); renderMath(); };
    $('#resetParams').onclick = function () {
      const oldM = activeModel().M; delete state.overrides[cfgKey()]; recomputeModel();
      if (activeModel().M !== oldM && !isBusy()) buildStones();
      renderHud(); renderPaytable(); writeStore(); renderMath();
    };
    $('#mcBtn').onclick = function () { runMC(100000); };
    $('#selFloor').onclick = function () { selectFace('F'); };
    $('#selAll').onclick = function () { selectFace('*'); };
    $('#resetBal').onclick = resetBalance;
  }
  function renderStats() {
    const g = $('#statGrid'); if (!g) return;
    const s = state.stats, rtp = s.bet > 0 ? fmtPct(s.win / s.bet, 2) : '—';
    g.innerHTML = '<div><span>局數</span><b>' + s.rounds + '</b></div><div><span>光柱次數</span><b>' + s.lines + '</b></div>' +
      '<div><span>總下注</span><b>' + fmt(s.bet) + '</b></div><div><span>總贏分</span><b>' + fmt(s.win) + '</b></div>' +
      '<div><span>實際 RTP</span><b>' + rtp + '</b></div><div><span>單局最高</span><b>' + fmt(s.maxWin) + '</b></div>';
  }
  async function runMC(total) {
    const token = mcToken, btn = $('#mcBtn'), prog = $('#mcProg');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    const mdl = activeModel(), lines = W.lines.map(function (l) { return l.cells; }), n = mdl.n, L = state.N;
    const odds = mdl.rows.map(function (r) { return r.odds; });
    const hist = new Float64Array(L + 1), occ = new Uint8Array(n), idx = new Int16Array(n);
    let sum = 0, sumsq = 0, done = 0;
    while (done < total) {
      const end = Math.min(total, done + 4000);
      for (let r = done; r < end; r++) {
        const u = rng(); let m = 0; while (m < mdl.M && u > mdl.mCum[m]) m++;
        for (let i = 0; i < n; i++) idx[i] = i;
        for (let i = 0; i < m; i++) { const j = i + Math.floor(rng() * (n - i)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; occ[idx[i]] = 1; }
        let ret = 0;
        for (let q = 0; q < lines.length; q++) { const cl = lines[q]; let k = 0; for (let c = 0; c < cl.length; c++) k += occ[cl[c]]; hist[k]++; ret += odds[k]; }
        ret /= lines.length; sum += ret; sumsq += ret * ret;
        for (let i = 0; i < m; i++) occ[idx[i]] = 0;
      }
      done = end;
      if (token !== mcToken) return;
      prog.style.width = ((done / total) * 100).toFixed(1) + '%';
      await wait(0);
    }
    if (token !== mcToken) return;
    const mean = sum / total, sd = Math.sqrt(Math.max(0, sumsq / total - mean * mean)), ci = (1.96 * sd) / Math.sqrt(total), denom = total * lines.length;
    const rows = mdl.rows.map(function (r) { return '<tr><td>' + r.k + '</td><td>' + fmtPct(r.p, 3) + '</td><td>' + fmtPct(hist[r.k] / denom, 3) + '</td></tr>'; }).join('');
    $('#mcOut').innerHTML = '<div class="big">' + fmtPct(mean, 3) + '<small>± ' + fmtPct(ci, 3) + '</small></div>' +
      '<p>模擬 RTP，理論值 ' + fmtPct(mdl.rtp, 3) + (state.bonus ? '（Bonus 參數）' : '') + ' · ' + total.toLocaleString('en-US') + ' 局 × ' + lines.length + ' 道光柱</p>' +
      '<div class="tbl-wrap"><table class="mt"><thead><tr><th>命中 k</th><th>理論</th><th>模擬</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p>波動：單線押注 σ ' + mdl.sigma.toFixed(3) + '，押滿所有面 σ ' + sd.toFixed(3) + '</p>';
    btn.disabled = false;
  }

  /* ================= loop & boot ================= */
  let lastT = 0;
  function tick(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
    if (W) {
      updateCamera(dt); updateWallVisibility(); updateIdle(now);
      for (const s of W.stones) updateStone(s, dt, now);
      for (const b of W.beams.values()) updateBeam(b, now);
      updatePreview(now); updateTiles(now);
      if (state.phase === 'running' && now >= W.nextGhost) { spawnGhost((Math.random() * W.X * W.Y * W.Z) | 0, 0.5); W.nextGhost = now + timings().ghostEvery; }
      updateGhosts(now); updateFlares(now); updateDust(dt); updateTorches(now);
      R.renderer.render(R.scene, R.camera);
      updateLabels();
    }
    requestAnimationFrame(tick);
  }
  function fatal(msg) { const v = $('#veil'); v.classList.remove('gone'); v.classList.add('err'); $('#veilText').textContent = msg; }
  function onKey(e) {
    const t = e.target, tag = t && t.tagName;
    if (e.key === 'Escape') { openDrawer(false); return; }
    if (e.code === 'Space' && !(tag === 'INPUT' || tag === 'BUTTON' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable))) { e.preventDefault(); startRound(); }
  }
  function bindUI() {
    $$('#modeSeg button').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });
    $$('#sizeSeg button').forEach(function (b) { b.addEventListener('click', function () { setSize(+b.dataset.n); }); });
    $('#viewBtn').addEventListener('click', function () { resetView(false); });
    $('#soundBtn').addEventListener('click', toggleSound);
    $('#mathBtn').addEventListener('click', function () { openDrawer(!$('#drawer').classList.contains('open')); });
    $('#drawerClose').addEventListener('click', function () { openDrawer(false); });
    $('#scrim').addEventListener('click', function () { openDrawer(false); });
    $('#clearBtn').addEventListener('click', clearBets);
    $('#autoBtn').addEventListener('click', toggleAuto);
    $('#turboBtn').addEventListener('click', toggleTurbo);
    $('#startBtn').addEventListener('click', function () { startRound(); });
    window.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', function () { sfx.ensure(); }, { once: true, capture: true });
    if (window.ResizeObserver) new ResizeObserver(onResize).observe($('#stage')); else window.addEventListener('resize', onResize);
    bindCanvas();
  }
  function start(data) {
    data = data || {};
    if (typeof THREE === 'undefined') { fatal('3D 引擎沒有載入。請確認網路能連到 cdnjs.cloudflare.com，然後重新整理頁面。'); return; }
    if (!initRenderer()) { fatal('這個瀏覽器無法啟動 WebGL。請改用最新版的 Chrome、Edge 或 Safari 開啟。'); return; }
    const src = Object.assign({}, readStore(), data);
    state.mode = src.mode === '2.5D' ? '2.5D' : '3D';
    state.N = SIZES.indexOf(src.N) >= 0 ? src.N : 4;
    state.balance = Number.isFinite(src.balance) && src.balance >= 0 ? src.balance : START_BALANCE;
    state.chip = CHIPS.indexOf(src.chip) >= 0 ? src.chip : 10;
    state.sound = src.sound !== false;
    state.turbo = typeof src.turbo === 'boolean' ? src.turbo : REDUCED;
    state.backWall = !!src.backWall;
    state.overrides = src.overrides && typeof src.overrides === 'object' ? src.overrides : {};
    if (src.stats && typeof src.stats === 'object') ['rounds', 'bet', 'win', 'maxWin', 'lines'].forEach(function (k) { if (Number.isFinite(src.stats[k])) state.stats[k] = src.stats[k]; });
    if (Array.isArray(src.history)) state.history = src.history.filter(Number.isFinite).slice(0, 10);
    recomputeModel();
    buildWorld();
    if (Array.isArray(data.bets)) data.bets.forEach(function (e) { if (Array.isArray(e) && W.lineByKey.has(e[0]) && Number.isFinite(e[1]) && e[1] > 0) state.bets.set(e[0], e[1]); });
    else seedSampleBets();
    state.bets.forEach(function (_, k) { W.beams.set(k, makeBeam(k)); });
    bindUI(); onResize(); resetView(true);
    refreshAllLabels(); renderAll();
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') {
      try { hot.snapshot(function () { return Object.assign(persistable(), { bets: Array.from(state.bets.entries()) }); }); } catch (e) { /* ignore */ }
    }
    lastT = performance.now();
    requestAnimationFrame(tick);
    setTimeout(function () { $('#veil').classList.add('gone'); }, 150);
  }

  const hotApi = window.claude && window.claude.hot;
  if (hotApi && typeof hotApi.ready === 'function') hotApi.ready(start);
  else start((hotApi && hotApi.data) || {});
})();
</script>
